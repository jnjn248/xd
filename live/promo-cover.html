<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>自动化学院 · 新生先导培训</title>
  <style>
    :root { --ink:#101314; --muted:#667173; --line:#dfe3df; --yellow:#e7f34b; --blue:#4fa7ff; --red:#ff5e56; }
    * { box-sizing:border-box; }
    html, body { min-height:100%; margin:0; }
    body { overflow:hidden; background:#fff; color:var(--ink); font-family:"Microsoft YaHei","PingFang SC",sans-serif; }
    .cover { position:relative; min-height:100vh; overflow:hidden; display:grid; place-items:center; background:#fff; }
    #coverCanvas { position:absolute; inset:0; width:100%; height:100%; }
    .grid { position:absolute; inset:0; pointer-events:none; background-image:linear-gradient(rgba(16,19,20,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(16,19,20,.055) 1px,transparent 1px); background-size:52px 52px; mask-image:linear-gradient(to bottom,transparent,black 20%,black 76%,transparent); }
    .topbar { position:absolute; top:0; left:0; right:0; z-index:2; display:flex; justify-content:space-between; align-items:center; padding:24px 32px; color:var(--muted); font-size:11px; font-weight:800; letter-spacing:.1em; }
    .brand { display:flex; gap:10px; align-items:center; }
    .mark { width:28px; height:28px; display:grid; place-items:center; border-radius:7px; background:var(--ink); color:var(--yellow); font-weight:900; }
    .live { display:inline-flex; gap:7px; align-items:center; padding:7px 10px; border:1px solid var(--line); border-radius:999px; background:rgba(255,255,255,.75); color:var(--ink); }
    .dot { width:7px; height:7px; border-radius:50%; background:var(--red); box-shadow:0 0 0 4px rgba(255,94,86,.14); }
    .copy { position:relative; z-index:1; width:min(1100px,calc(100% - 80px)); pointer-events:none; }
    .kicker { display:flex; gap:10px; align-items:center; color:var(--muted); font-size:11px; font-weight:900; letter-spacing:.16em; }
    .kicker::before { content:""; width:34px; height:3px; background:var(--blue); }
    h1 { max-width:790px; margin:26px 0 18px; font-size:clamp(54px,9vw,132px); line-height:.88; letter-spacing:-.07em; text-shadow:8px 8px 0 rgba(231,243,75,.78); animation:rise .8s cubic-bezier(.2,.8,.2,1) both; }
    p { max-width:560px; margin:0; color:var(--muted); font-size:14px; line-height:1.8; animation:rise .8s .14s both; }
    .meta { display:flex; flex-wrap:wrap; gap:8px; margin-top:32px; animation:rise .8s .24s both; }
    .meta span { padding:8px 10px; border:1px solid var(--line); border-radius:5px; background:rgba(255,255,255,.82); color:#4f595a; font-size:10px; font-weight:900; }
    .enter { position:relative; z-index:3; display:inline-flex; align-items:center; gap:10px; margin-top:28px; padding:12px 15px; border:1px solid var(--ink); border-radius:8px; background:var(--ink); color:#fff; font-size:12px; font-weight:900; pointer-events:auto; text-decoration:none; transition:transform .2s ease,background .2s ease; }
    .enter:hover { transform:translateY(-3px); background:#283234; }
    .note { position:absolute; right:8%; bottom:13%; z-index:2; max-width:190px; color:#778181; font-size:10px; line-height:1.7; text-align:right; }
    .note strong { display:block; margin-bottom:6px; color:var(--ink); font-size:18px; letter-spacing:-.04em; }
    .countdown { position:absolute; right:8%; top:32%; z-index:2; min-width:330px; padding:21px 22px; border:1px solid var(--line); border-radius:12px; background:rgba(255,255,255,.9); box-shadow:0 18px 42px rgba(16,19,20,.11); }
    .countdown-label { margin-bottom:12px; color:var(--muted); font-size:12px; font-weight:900; letter-spacing:.14em; }
    .countdown-time { display:flex; align-items:baseline; gap:12px; color:var(--ink); font-size:36px; font-weight:900; letter-spacing:-.05em; }
    .countdown-unit { display:flex; align-items:baseline; gap:3px; }
    .countdown-unit span { min-width:38px; }
    .countdown-unit small { color:var(--blue); font-size:11px; font-weight:900; letter-spacing:0; }
    .countdown-caption { margin-top:8px; color:#7a8282; font-size:10px; }
    .live-room { display:flex; align-items:center; justify-content:space-between; gap:18px; min-width:100%; margin-top:17px; padding:17px 18px; border:2px solid var(--ink); border-radius:10px; background:var(--yellow); color:var(--ink); font-size:18px; font-weight:900; text-decoration:none; box-shadow:7px 7px 0 var(--ink); transition:transform .2s ease, background .2s ease, box-shadow .2s ease; }
    .live-room:hover { transform:translateY(-3px); background:#f2ff5c; box-shadow:9px 9px 0 var(--ink); }
    .live-room small { color:var(--ink); font-size:14px; font-weight:900; white-space:nowrap; }
    @keyframes rise { from { opacity:0; transform:translateY(24px); } to { opacity:1; transform:translateY(0); } }
    @media (max-width:650px) { .cover { display:block; min-height:100svh; overflow-y:auto; padding:86px 20px 24px; } .topbar { padding:18px; } .copy { width:100%; text-align:center; } .kicker { justify-content:center; } .copy h1 { margin:20px auto 18px; font-size:50px; line-height:.94; } .copy p { margin-inline:auto; font-size:12px; } .meta { justify-content:center; margin-top:22px; } .countdown { position:relative; left:auto; right:auto; top:auto; bottom:auto; width:100%; min-width:0; margin-top:32px; } .countdown-time { gap:7px; font-size:28px; justify-content:space-between; } .countdown-unit span { min-width:30px; } .live-room { font-size:14px; padding:13px; gap:8px; box-shadow:5px 5px 0 var(--ink); } .live-room small { font-size:10px; } }
  </style>
</head>
<body>
  <main class="cover">
    <canvas id="coverCanvas" aria-label="自动化学院动态宣传图"></canvas>
    <div class="grid"></div>
    <header class="topbar"><div class="brand"><span>自动化学院 · 新生先导培训</span></div><span class="live"><i class="dot"></i> 直播 / 01</span></header>
    <section class="copy">
      <div class="kicker">自动化学院 · 新生先导培训 · 2026</div>
      <h1>感知万物，<br>驱动未来。</h1>
      <p>从传感器、电机到智能系统与飞控，<br>一起找到属于你的升学与就业路线。</p>
      <div class="meta"><span>感知</span><span>决策</span><span>控制</span><span>行动</span></div>
    </section>
    <aside class="countdown" aria-live="polite">
      <div class="countdown-label">距离直播开始</div>
      <div class="countdown-time"><div class="countdown-unit"><span id="days">00</span><small>天</small></div><div class="countdown-unit"><span id="hours">00</span><small>时</small></div><div class="countdown-unit"><span id="minutes">00</span><small>分</small></div><div class="countdown-unit"><span id="seconds">00</span><small>秒</small></div></div>
      <div class="countdown-caption" id="countdownCaption">2026.08.28 · 20:30</div>
      <a class="live-room" href="https://live.bilibili.com/7842156" target="_blank" rel="noopener noreferrer"><span>进入 B 站直播间 ↗</span><small>房间号 7842156</small></a>
    </aside>
  </main>
  <script>
    const canvas = document.getElementById('coverCanvas');
    const ctx = canvas.getContext('2d');
    const nodes = Array.from({ length: 52 }, (_, index) => ({ x:Math.random(), y:Math.random(), size:1+Math.random()*3, speed:.00025+Math.random()*.00055, tone:index%5===0?'#e7f34b':index%3===0?'#4fa7ff':'#101314' }));
    function resize() { const ratio=Math.min(window.devicePixelRatio||1,2); canvas.width=Math.floor(innerWidth*ratio); canvas.height=Math.floor(innerHeight*ratio); ctx.setTransform(ratio,0,0,ratio,0,0); }
    function draw(time) {
      const w=innerWidth, h=innerHeight, cx=w*.72, cy=h*.54, orbit=Math.min(w,h)*.25;
      ctx.clearRect(0,0,w,h);
      ctx.save(); ctx.translate(cx,cy); ctx.rotate(-.2);
      for(let ring=0;ring<8;ring++){ ctx.beginPath(); ctx.ellipse(0,0,orbit+ring*34,orbit*.47+ring*18,ring*.08,0,Math.PI*2); ctx.strokeStyle=ring%2?'rgba(79,167,255,.48)':'rgba(16,19,20,.16)'; ctx.lineWidth=ring===3?2:1; ctx.stroke(); }
      ctx.restore();
      ctx.beginPath(); ctx.moveTo(w*.52,h*.22); ctx.lineTo(w*.95,h*.82); ctx.strokeStyle='rgba(231,243,75,.85)'; ctx.lineWidth=2; ctx.stroke();
      const points=nodes.map(node=>{ node.x+=node.speed; if(node.x>1.08)node.x=-.08; return {x:node.x*w,y:(node.y+Math.sin(time*.00045+node.x*11)*.035)*h,node}; });
      points.forEach((point,index)=>{ points.slice(index+1).forEach(target=>{const distance=Math.hypot(point.x-target.x,point.y-target.y); if(distance<112){ctx.beginPath();ctx.moveTo(point.x,point.y);ctx.lineTo(target.x,target.y);ctx.strokeStyle=`rgba(79,167,255,${(1-distance/112)*.22})`;ctx.lineWidth=1;ctx.stroke();}}); ctx.beginPath();ctx.arc(point.x,point.y,point.node.size,0,Math.PI*2);ctx.fillStyle=point.node.tone;ctx.globalAlpha=.72;ctx.fill();ctx.globalAlpha=1;});
      ctx.beginPath();ctx.arc(cx,cy,8+Math.sin(time*.003)*2,0,Math.PI*2);ctx.fillStyle='#ff5e56';ctx.shadowColor='rgba(255,94,86,.7)';ctx.shadowBlur=22;ctx.fill();ctx.shadowBlur=0;
      requestAnimationFrame(draw);
    }
    resize(); window.addEventListener('resize',resize); requestAnimationFrame(draw);

    const targetTime = new Date('2026-08-28T20:30:00+08:00').getTime();
    const countdownNodes = { days:document.getElementById('days'), hours:document.getElementById('hours'), minutes:document.getElementById('minutes'), seconds:document.getElementById('seconds'), caption:document.getElementById('countdownCaption') };
    let countdownTimer;
    function updateCountdown() {
      const remaining = Math.max(0, targetTime - Date.now());
      const totalSeconds = Math.floor(remaining / 1000);
      countdownNodes.days.textContent = String(Math.floor(totalSeconds / 86400)).padStart(2, '0');
      countdownNodes.hours.textContent = String(Math.floor((totalSeconds % 86400) / 3600)).padStart(2, '0');
      countdownNodes.minutes.textContent = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
      countdownNodes.seconds.textContent = String(totalSeconds % 60).padStart(2, '0');
      if (remaining === 0) { countdownNodes.caption.textContent = '直播已经开始'; clearInterval(countdownTimer); }
    }
    updateCountdown();
    countdownTimer = setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
